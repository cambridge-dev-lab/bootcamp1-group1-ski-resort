<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ski Resort Reviews</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <header>
    <div class="brand">
      <span class="trail-marks">
        <span class="trail-mark-green">●</span><span class="trail-mark-blue">■</span><span
          class="trail-mark-black">◆</span>
      </span>
      <h1>Ski Resort Reviews</h1>
    </div>
    <div class="view-toggle">
      <button id="map-btn" class="toggle-btn active">Map</button>
      <button id="list-btn" class="toggle-btn">List</button>
    </div>
    <button id="login-btn" class="login-btn">Log in</button>
  </header>

  <div id="map-view">
    <div id="map">
    </div>

    <div class="review-card">
      <button type="button" class="review-card__close">X</button>
      <h3 class="review-card__title"></h3>

      <dialog id="dialog">
        <div class="review-card__heading">
          Submit your review:
          <button type="button" id="close" class="review-card__close">X</button>
        </div>

        <form name="review" id="review-form">
          <div class="review-form-container">
            <div>
              <input class="review-form__input" placeholder="Your name" name="author" required />
            </div>

            <div>
              <fieldset class="stars">
                <input type="radio" id="s5" name="rating" value="5" required>
                <label for="s5">★</label>

                <input type="radio" id="s4" name="rating" value="4">
                <label for="s4">★</label>

                <input type="radio" id="s3" name="rating" value="3">
                <label for="s3">★</label>

                <input type="radio" id="s2" name="rating" value="2">
                <label for="s2">★</label>

                <input type="radio" id="s1" name="rating" value="1">
                <label for="s1">★</label>
              </fieldset>
            </div>

            <div>
              <input class="review-form__input" placeholder="Favorite slope" name="slope" />
            </div>
            <div>
              <textarea class="review-form__input body" placeholder="Your review..." name="body"></textarea>
            </div>
            <div>
              <input class="review-form__input submit" type="submit" value="Post Review" />
            </div>

          </div>
        </form>

      </dialog>

      <button id="open" class="review-card__add">Add Review</button>

      <div id="review-card__review-box"></div>
    </div>
  </div>

  <div id="list-view" class="hidden">
    ToDo: List
    <select id="resort-select">
      <option value="all">All resorts</option>
    </select>
    <div id="reviews">
      ToDo: Reviews
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="list.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>

</html>
